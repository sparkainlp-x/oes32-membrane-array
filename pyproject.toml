[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oes32-membrane-array"
version = "0.1.0"
description = "Atomic scale-out composition for fixed-width OES32 membrane cells"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "oes32-membrane-shield @ git+https://github.com/sparkainlp-x/oes32-membrane-shield.git@v2.0.1",
]
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Jean-François Brisson" }]
keywords = ["membrane", "OES32", "array", "atomic-update", "state-machine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/sparkainlp-x/oes32-membrane-array"
Issues = "https://github.com/sparkainlp-x/oes32-membrane-array/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
